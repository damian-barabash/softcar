name: Build & deploy

on:
  push:
    branches: [main]
  # klient klika „Opublikuj zmiany” w panelu -> Edge Function „publish” wysyla to zdarzenie
  repository_dispatch:
    types: [content-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jednoczesnie tylko jedno wdrozenie; kolejne czeka zamiast sie sciagac z biezacym
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Budowanie strony
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Kontrola jakości wydruku
        run: node scripts/qc.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
